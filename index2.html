<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full Screen Gallery</title>
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      font-family: 'Segoe UI', sans-serif;
      scroll-behavior: smooth;
      background: #000;
    }

    .hero-section {
      position: relative;
      height: 100vh;
      width: 100%;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }

    .hero-content {
      z-index: 2;
      max-width: 90%;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1;
    }

    h1, h2, p {
      margin-bottom: 1rem;
    }

    .section-title {
      font-size: 3rem;
      font-weight: bold;
    }

    .caption {
      font-size: 1.3rem;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #111;
      color: #ccc;
    }
  </style>
</head>
<body>

  <!--Section 1 -->
  <section class="hero-section" style="background-image: url('images/ANU08677.jpg');">
    <div class="overlay"></div>
    <div class="hero-content" data-aos="fade-up">
      <h1 class="section-title">Welcome to My Gallery</h1>
      <p class="caption">Scroll down to explore the beauty</p>
    </div>
  </section>

  <!-- Section 2 -->
  <section class="hero-section" style="background-image: url('images/DSC09242.jpg');">
    <div class="overlay"></div>
    <div class="hero-content" data-aos="fade-up">
      <h2 class="section-title">Nature's Peace</h2>
      <p class="caption">Feel the calm in every frame</p>
    </div>
  </section>

  <!-- Section 3 -->
  <section class="hero-section" style="background-image: url('images/SAT01609.jpg');">
    <div class="overlay"></div>
    <div class="hero-content" data-aos="fade-up">
      <h2 class="section-title">Urban Vibes</h2>
      <p class="caption">Lights. Movement. Life.</p>
    </div>
  </section>

  <!-- Section 4 -->
  <section class="hero-section" style="background-image: url('images/IMG_7941.jpg');">
    <div class="overlay"></div>
    <div class="hero-content" data-aos="fade-up">
      <h2 class="section-title">Portraits of Emotion</h2>
      <p class="caption">Every face tells a story</p>
    </div>
  </section>

  <!-- Footer -->
  <!-- <footer>
    &copy; 2025 My Photography. All rights reserved.
  </footer> -->

  <!--AOS -->
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({
      duration: 1200,
      once: true
    });
  </script> 

</body>
</html>
